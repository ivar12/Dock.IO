{% extends "base.html" %}
{% block title %}Sign in - Docker Manager{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Username<input name="username" value="admin" required autofocus></label>
    <label>Password<input type="password" name="password" required></label>
    <button type="submit">Log in</button>
  </form>
  {% if oidc.enabled and oidc.authorize_ready %}
  <hr>
  <a class="button secondary" href="/auth/oidc">Log in with OpenID</a>
  {% endif %}
</div>
{% endblock %}

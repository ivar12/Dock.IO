{% extends "base.html" %}
{% block title %}Activity - Docker Manager{% endblock %}
{% block content %}
<h1>Activity log</h1>
<table>
  <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead>
  <tbody>
  {% for e in entries %}
    <tr><td class="mono">{{ e.ts }}</td><td>{{ e.actor }}</td><td>{{ e.action }}</td><td class="mono wrap">{{ e.detail }}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}

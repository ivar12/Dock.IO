<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dock.IO{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/filters.js" defer></script>
</head>
<body>
<header>
  <a class="brand" href="/">Dock.IO <span class="version">v{{ app_version }}</span></a>
  {% set release = release_info() %}
  {% if release.available %}<a class="update-available" href="{{ release.url or '/updates' }}" title="A newer Dock.IO release is available">Update available: v{{ release.latest }}</a>{% endif %}
  {% if user %}
  <nav>
    <a href="/">Containers</a>
    <a href="/images">Images</a>
    <a href="/networks">Networks</a>
    <a href="/schedules">Schedules</a>
    <a href="/updates">Updates</a>
    <a href="/logs">Activity</a>
    <a href="/settings">Settings</a>
    <span class="user">{{ user }}</span>
    <a href="/auth/logout">Log out</a>
  </nav>
  {% endif %}
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
